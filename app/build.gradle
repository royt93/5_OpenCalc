apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 37

    // N-INFRA-1: baseline lỗi lint đã tồn tại từ trước (vd F-UI-7 onBackPressed deprecated)
    // để CI không fail ngay lần chạy đầu vì nợ kỹ thuật cũ — lỗi MỚI phát sinh sau baseline
    // này vẫn sẽ fail CI như bình thường.
    lint {
        baseline = file("lint-baseline.xml")
    }

    namespace 'com.mckimquyen.opencal'
    defaultConfig {
        applicationId "com.mckimquyen.opencal"
        resourceConfigurations += ['ar', 'az', 'bn', 'bs', 'cs', 'de', 'el', 'es', 'fa', 'fr', 'hi', 'hr', 'in', 'it', 'ja', 'mk', 'ml', 'nb-rNO', 'or', 'pl', 'pt-rBR', 'ru', 'sr', 'tr', 'uk', 'vi', 'zh-rHK', 'zh-rTW']
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 20260931
        versionName "2026.08.31"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword KS_PW
            keyAlias KS_ALIAS
            keyPassword KS_PW
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            //used android.enableR8=true in gradle.properties
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
//            applicationIdSuffix ".release"
            // nhớ check APPLICATION_ID trong manifest
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3612191981543807/4627557404\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3612191981543807/4059747044\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID", "\"ca-app-pub-3612191981543807/7338622864\""
            buildConfigField "String", "APPLOVIN_SDK_KEY", "\"e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt\""
            buildConfigField "String", "APPLOVIN_BANNER_ID", "\"86cdc9050561f316\""
            buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID", "\"4e8de0b36750ea6c\""
            buildConfigField "String", "APPLOVIN_APP_OPEN_ID", "\"e9b4e3a8e16b96d4\""
            // Rewarded: AdMob dùng test ID Google tạm thời (thay ID thật trước khi phát hành);
            // AppLovin dùng ID có sẵn trong source (doc/AD.MD).
            buildConfigField "String", "ADMOB_REWARDED_ID", "\"ca-app-pub-3940256099942544/5224354917\""
            buildConfigField "String", "APPLOVIN_REWARDED_ID", "\"5423b3cd5889dcae\""
            // VIP secret (Base64 của plain key 30 ngày) — đi qua BuildConfig, không hardcode plain trong .kt.
            buildConfigField "String", "VIP_SECRET_B64", "\"OWZBMHE3ZU4hMjdjTHgwNEAyMTk5M1kydTBJNyNRMA==\""
            buildConfigField "String", "PRIVACY_POLICY_URL", "\"https://loitp.notion.site/loitp/Privacy-Policy-319b1cd8783942fa8923d2a3c9bce60f/\""
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "false"
        }
        debug {
            minifyEnabled false
            //used android.enableR8=true in gradle.properties
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//            applicationIdSuffix ".debug"
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID", "\"ca-app-pub-3940256099942544/9257395921\""
            buildConfigField "String", "APPLOVIN_SDK_KEY", "\"e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt\""
            buildConfigField "String", "APPLOVIN_BANNER_ID", "\"86cdc9050561f316\""
            buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID", "\"4e8de0b36750ea6c\""
            buildConfigField "String", "APPLOVIN_APP_OPEN_ID", "\"e9b4e3a8e16b96d4\""
            // Rewarded test ID Google cho debug.
            buildConfigField "String", "ADMOB_REWARDED_ID", "\"ca-app-pub-3940256099942544/5224354917\""
            buildConfigField "String", "APPLOVIN_REWARDED_ID", "\"5423b3cd5889dcae\""
            buildConfigField "String", "VIP_SECRET_B64", "\"OWZBMHE3ZU4hMjdjTHgwNEAyMTk5M1kydTBJNyNRMA==\""
            buildConfigField "String", "PRIVACY_POLICY_URL", "\"https://loitp.notion.site/loitp/Privacy-Policy-319b1cd8783942fa8923d2a3c9bce60f/\""
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "false"
        }
    }

    viewBinding {
        enabled = true
    }

    buildFeatures {
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = 17
    }

    testOptions {
        // Cho phép gọi android.util.Log (qua Logger) trong unit test JVM mà không ném
        // "Method not mocked" — trả về giá trị mặc định thay vì throw.
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = defaultConfig.applicationId + buildType.name + "_" + defaultConfig.versionName + "_" + defaultConfig.versionCode + ".apk"
        }
    }

    flavorDimensions.add("type")
    productFlavors {

        dev {
            dimension "type"
            buildConfigField("String", "FLAVOR_buildEnv", '"dev"')
//            resValue "string", "app_name", "Base DEV"

//            resValue("string", "SDK_KEY", "e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt")
//            resValue("string", "BANNER", "86cdc9050561f316")
//            resValue("string", "INTER", "4e8de0b36750ea6c")
//            resValue("string", "EnableAdInter", "true")
//            resValue("string", "EnableAdBanner", "true")
        }

        production {
            dimension "type"
            buildConfigField("String", "FLAVOR_buildEnv", '"prod"')
//            resValue "string", "app_name", "Base"

//            resValue("string", "SDK_KEY", "e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt")
//            resValue("string", "BANNER", "86cdc9050561f316")
//            resValue("string", "INTER", "4e8de0b36750ea6c")
//            resValue("string", "EnableAdInter", "true")
//            resValue("string", "EnableAdBanner", "true")
        }

    }
}

dependencies {
    api fileTree(dir: "libs", include: ["*.jar"])
    api 'androidx.core:core-ktx:1.16.0'
    api 'androidx.appcompat:appcompat:1.7.0'
    api 'androidx.preference:preference-ktx:1.2.1'
    api 'androidx.constraintlayout:constraintlayout:2.2.1'
    api 'com.google.android.material:material:1.12.0'
    api "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    api 'com.github.hannesa2:AndroidSlidingUpPanel:4.5.0'
    api 'com.google.code.gson:gson:2.13.1'
//    api 'com.applovin:applovin-sdk:13.0.1'
    // AdmobApplovinWrapper SDK — AdMob + AppLovin + AdSafety + UMP consent + VIP-by-key + auto-trial
    implementation("com.github.royt93:AdmobApplovinWrapper:1.1.5")
    implementation("com.google.android.play:review:2.0.2")
    implementation("com.google.android.play:review-ktx:2.0.2")
    // Confetti khi activate VIP thành công (VIP screen animation #5)
    implementation("nl.dionsegijn:konfetti-xml:2.0.5")
//    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    // ===== Unit test (JVM) =====
    testImplementation 'junit:junit:4.13.2'

    // ===== Instrumented / integration test (on-device) =====
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
}
