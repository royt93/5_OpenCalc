apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

import java.util.Properties

def defaultSecretsDir = '/Users/loitran/AndroidStudioProjects/@mckimquyen/myKeyStore/com.mckimquyen.opencal'
def secretsDir = providers.gradleProperty('OPEN_CALC_SECRETS_DIR').orNull ?:
    System.getenv('OPEN_CALC_SECRETS_DIR') ?: defaultSecretsDir
def releaseProperties = new Properties()
def releasePropertiesFile = new File(secretsDir, 'keystore.properties')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}

def releaseSecret = { String key -> releaseProperties.getProperty(key, '').trim() }

android {
    compileSdk 37

    // N-INFRA-1: baseline lỗi lint đã tồn tại từ trước (vd F-UI-7 onBackPressed deprecated)
    // để CI không fail ngay lần chạy đầu vì nợ kỹ thuật cũ — lỗi MỚI phát sinh sau baseline
    // này vẫn sẽ fail CI như bình thường.
    lint {
        baseline = file("lint-baseline.xml")
    }

    namespace 'com.mckimquyen.opencal'
    defaultConfig {
        applicationId "com.mckimquyen.opencal"
        resourceConfigurations += ['ar', 'az', 'bn', 'bs', 'cs', 'de', 'el', 'es', 'fa', 'fr', 'hi', 'hr', 'in', 'it', 'ja', 'mk', 'ml', 'nb-rNO', 'or', 'pl', 'pt-rBR', 'ru', 'sr', 'tr', 'uk', 'vi', 'zh-rHK', 'zh-rTW']
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 20260931
        versionName "2026.08.31"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def releaseStoreFile = releaseSecret('storeFile')
            storeFile releaseStoreFile ? new File(secretsDir, releaseStoreFile) : null
            storePassword releaseSecret('storePassword')
            keyAlias releaseSecret('keyAlias')
            keyPassword releaseSecret('keyPassword')
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            //used android.enableR8=true in gradle.properties
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
//            applicationIdSuffix ".release"
            // Không có fallback test cho release. Task release fail-fast bên dưới nếu thiếu config.
            manifestPlaceholders = [admobAppId: releaseSecret('admobAppIdRelease')]
            buildConfigField "String", "ADMOB_BANNER_ID", "\"${releaseSecret('admobBannerIdRelease')}\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"${releaseSecret('admobInterstitialIdRelease')}\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID", "\"${releaseSecret('admobAppOpenIdRelease')}\""
            buildConfigField "String", "ADMOB_REWARDED_ID", "\"${releaseSecret('admobRewardedIdRelease')}\""
            // AppLovin — SDK chọn ĐÚNG 1 provider theo IS_ENABLE_ADMOB (GmsBridge.createProvider:
            // if/else, KHÔNG chạy song song, KHÔNG tự failover khi AdMob lỗi). Cấu hình đủ ở đây chỉ
            // để sẵn sàng nếu sau này CHỦ ĐỘNG đổi IS_ENABLE_ADMOB=false (vd tài khoản AdMob bị khoá,
            // cần thao tác thủ công + rebuild). Đọc từ keystore.properties (KHÔNG hardcode plain vào
            // git-tracked file — key này từng bị commit/push lên repo public trước đây, xem README).
            buildConfigField "String", "APPLOVIN_SDK_KEY", "\"${releaseSecret('applovinSdkKey')}\""
            buildConfigField "String", "APPLOVIN_BANNER_ID", "\"${releaseSecret('applovinBannerId')}\""
            buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID", "\"${releaseSecret('applovinInterstitialId')}\""
            buildConfigField "String", "APPLOVIN_APP_OPEN_ID", "\"${releaseSecret('applovinAppOpenId')}\""
            buildConfigField "String", "APPLOVIN_REWARDED_ID", "\"${releaseSecret('applovinRewardedId')}\""
            // VIP secret (Base64 của plain key 30 ngày) — đi qua BuildConfig, không hardcode plain trong .kt.
            buildConfigField "String", "VIP_SECRET_B64", "\"OWZBMHE3ZU4hMjdjTHgwNEAyMTk5M1kydTBJNyNRMA==\""
            buildConfigField "String", "PRIVACY_POLICY_URL", "\"${releaseSecret('privacyPolicyUrl')}\""
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "true"
        }
        debug {
            minifyEnabled false
            //used android.enableR8=true in gradle.properties
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//            applicationIdSuffix ".debug"
            // Google sample App ID + ad unit IDs: debug tuyệt đối không dùng inventory production.
            manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID", "\"ca-app-pub-3940256099942544/9257395921\""
            buildConfigField "String", "ADMOB_REWARDED_ID", "\"ca-app-pub-3940256099942544/5224354917\""
            // AppLovin — cùng ID với release, đọc từ keystore.properties (AppLovin không có khái niệm
            // "test ad unit ID" tách biệt như AdMob; xem ghi chú ở block release).
            buildConfigField "String", "APPLOVIN_SDK_KEY", "\"${releaseSecret('applovinSdkKey')}\""
            buildConfigField "String", "APPLOVIN_BANNER_ID", "\"${releaseSecret('applovinBannerId')}\""
            buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID", "\"${releaseSecret('applovinInterstitialId')}\""
            buildConfigField "String", "APPLOVIN_APP_OPEN_ID", "\"${releaseSecret('applovinAppOpenId')}\""
            buildConfigField "String", "APPLOVIN_REWARDED_ID", "\"${releaseSecret('applovinRewardedId')}\""
            buildConfigField "String", "VIP_SECRET_B64", "\"OWZBMHE3ZU4hMjdjTHgwNEAyMTk5M1kydTBJNyNRMA==\""
            buildConfigField "String", "PRIVACY_POLICY_URL", "\"https://loitp.notion.site/loitp/Privacy-Policy-319b1cd8783942fa8923d2a3c9bce60f/\""
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "true"
        }
    }

    viewBinding {
        enabled = true
    }

    buildFeatures {
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = 17
    }

    testOptions {
        // Cho phép gọi android.util.Log (qua Logger) trong unit test JVM mà không ném
        // "Method not mocked" — trả về giá trị mặc định thay vì throw.
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = defaultConfig.applicationId + buildType.name + "_" + defaultConfig.versionName + "_" + defaultConfig.versionCode + ".apk"
        }
    }

    flavorDimensions.add("type")
    productFlavors {

        dev {
            dimension "type"
            buildConfigField("String", "FLAVOR_buildEnv", '"dev"')
//            resValue "string", "app_name", "Base DEV"
        }

        production {
            dimension "type"
            buildConfigField("String", "FLAVOR_buildEnv", '"prod"')
//            resValue "string", "app_name", "Base"
        }

    }
}

dependencies {
    api fileTree(dir: "libs", include: ["*.jar"])
    api 'androidx.core:core-ktx:1.16.0'
    api 'androidx.appcompat:appcompat:1.7.0'
    api 'androidx.preference:preference-ktx:1.2.1'
    api 'androidx.constraintlayout:constraintlayout:2.2.1'
    api 'com.google.android.material:material:1.12.0'
    api "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    api 'com.github.hannesa2:AndroidSlidingUpPanel:4.5.0'
    api 'com.google.code.gson:gson:2.13.1'
    // Tag mới nhất đã xác minh có artifact JitPack ngày 2026-08-31.
    implementation("com.github.royt93:AdmobApplovinWrapper:1.7.3")
    implementation("com.google.android.play:review:2.0.2")
    implementation("com.google.android.play:review-ktx:2.0.2")
    // Confetti khi activate VIP thành công (VIP screen animation #5)
    implementation("nl.dionsegijn:konfetti-xml:2.0.5")
//    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    // ===== Unit test (JVM) =====
    testImplementation 'junit:junit:4.13.2'

    // ===== Instrumented / integration test (on-device) =====
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
}

// Release không được phép build bằng Google test IDs hoặc ID rỗng.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any {
        it.project == project && it.name.toLowerCase(Locale.ROOT).contains('release')
    }
    if (!buildingRelease) return

    def required = [
        'storeFile',
        'storePassword',
        'keyAlias',
        'keyPassword',
        'admobAppIdRelease',
        'admobBannerIdRelease',
        'admobInterstitialIdRelease',
        'admobAppOpenIdRelease',
        'admobRewardedIdRelease',
        'admobNativeIdRelease',
        'privacyPolicyUrl',
        'applovinSdkKey',
        'applovinBannerId',
        'applovinInterstitialId',
        'applovinAppOpenId',
        'applovinRewardedId',
    ]
    def missing = required.findAll { key ->
        def value = releaseSecret(key)
        value.isEmpty() || value.startsWith('YOUR_') || value.startsWith('ca-app-pub-3940256099942544')
    }
    if (!missing.isEmpty()) {
        throw new GradleException(
            "Release AdMob config missing/unsafe: ${missing.join(', ')}. " +
                "Configure ${releasePropertiesFile}."
        )
    }

    def signingFile = new File(secretsDir, releaseSecret('storeFile'))
    if (!signingFile.isFile()) {
        throw new GradleException("Release keystore not found: ${signingFile}")
    }
}
